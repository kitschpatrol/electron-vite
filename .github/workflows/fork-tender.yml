name: Fork Tender

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: fork-tender

jobs:
  tend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required: merges need full history
          persist-credentials: false

      - uses: kitschpatrol/github-action-fork-tender@7d4e37c0ed9d878952f824ac76da23721a5aaa73 # v1.1.0
        with:
          max-turns: 400
        env:
          # Bill your Claude subscription (token from `claude setup-token`):
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # …or bill per-token with an API key instead:
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
